name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p .
      - name: Unit tests
        run: bun test
      - name: Build and self-test the executor
        run: |
          cd exec
          ./build.sh
          build/OutboxExec.app/Contents/MacOS/outbox-exec selftest

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build Agent Outbox.app (ad-hoc signed, no secrets)
        run: scripts/build-app.sh
      - name: App self-check (headless)
        run: |
          cd app
          swift build
          .build/debug/AgentOutbox --selfcheck
      - name: Native approval self-test
        run: |
          cd app
          swift run native-approval-selftest
      - name: Zip the app
        run: ditto -c -k --keepParent "dist/Agent Outbox.app" dist/Agent-Outbox-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Outbox-app
          path: dist/Agent-Outbox-app.zip
          if-no-files-found: error
